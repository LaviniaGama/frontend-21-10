<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFix - Central de Ordens de Serviço</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header role="banner">
        <h1>TechFix — Central de Ordens de Serviço (OS)</h1>
    </header>

    <main role="main" class="container">
        <div class="row">
            <section class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header">
                        <span>Nova Ordem de Serviço</span>
                    </div>
                    <div class="card-body">
                        <form id="form-os">
                            <div class="mb-3">
                                <label for="cliente" class="form-label">Cliente</label>
                                <input type="text" id="cliente" name="cliente" class="form-control min-44" placeholder="Ex: SENAI" required>
                            </div>

                            <div class="mb-3">
                                <label for="equipamento" class="form-label">Equipamento</label>
                                <input type="text" id="equipamento" name="equipamento" class="form-control min-44" placeholder="Ex: Notebook Dell" required>
                            </div>

                            <div class="mb-3">
                                <label for="descricao" class="form-label">Descrição</label>
                                <textarea id="descricao" name="descricao" class="form-control min-44" rows="4" placeholder="Descreva o problema" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="valor-estimado" class="form-label">Valor estimado</label>
                                <input type="number" id="valor-estimado" name="valor-estimado" class="form-control min-44" step="0.01" min="0" placeholder="Ex: 350.00" required>
                            </div>

                            <div>
                                <button type="submit" class="btn btn-primary min-44">Cadastrar OS</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <section class="col-md-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header">
                        <span>Ordens de Serviço</span>
                        <span id="contador-os" class="badge bg-light text-dark">0 OS</span>
                    </div>
                    <div class="card-body">
                        <div id="container-os" class="row g-3"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
